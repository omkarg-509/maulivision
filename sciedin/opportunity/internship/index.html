<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Research Internships</title>

    <link rel="stylesheet" href="../../components/components.css">

  <meta charset="UTF-8" />
  <title>Research Internships | SciEdIn</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="internships.css">
</head>

<body>
<!-- ================= NAVBAR ================= -->

<div id="header"></div>

<!-- ================= HEADER ================= -->

<header class="intern-header">

  <h1>Research Internships</h1>

  <p id="quoteBox">
    "Internships turn curiosity into capability."
  </p>

</header>


<!-- ================= FILTERS ================= -->

<section class="filter-bar">

  <div class="container filter-container">

    <select id="countryFilter">
      <option value="">All Countries</option>
    </select>

    <select id="stipendFilter">
      <option value="">All Stipends</option>
      <option value="paid">Paid</option>
      <option value="unpaid">Unpaid</option>
    </select>

    <button id="clearFilters">Clear</button>

  </div>

</section>


<!-- ================= MAIN ================= -->

<section class="internships-section">

  <div class="container" id="internshipGrid">

    <!-- Cards by JS -->

  </div>

</section>

<script  src="./script.js"></script>
<script src="internships.js"></script>
<script src="../../components/components.js" defer></script>
  
<!-- ================= FOOTER ================= -->

<div id="footer"></div>

</body>
</html>
