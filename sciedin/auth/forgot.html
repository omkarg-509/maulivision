<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciEdIn | Forgot Password</title>
 <link rel="stylesheet" href="../style.css">
    
    <link rel="stylesheet" href="../components/components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<div id="header"></div>

<section class="auth section-sm">
  <div class="container">
    <div class="auth-grid">
      <div class="auth-card">
        <div class="auth-top">
          <div class="auth-badge">
            <span class="dot"></span>
            Reset your password
          </div>
          <h1>Forgot Password</h1>
          <p>Enter your email and we’ll send a reset link (demo UI only).</p>
        </div>

        <form class="auth-form" action="login" method="GET">
          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="you@example.com" required>
          </div>

          <button class="btn-primary w-full" type="submit">Send reset link</button>

          <div class="muted">
            Remember your password?
            <a class="link" href="login.html">Back to login</a>
          </div>
        </form>
      </div>

      <div class="auth-side">
        <div class="side-card highlight">
          <h3>Hackathon Note</h3>
          <p>This is UI-only. Clicking the button redirects back to Login.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>

<script src="script.js"></script>
<script src="../components/components.js" defer></script>

</body>
</html>
